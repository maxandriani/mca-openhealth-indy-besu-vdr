name: Quality Gate

env:
  NODE_VERSION: '26.12.0'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run_hardhat_tests:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.1
          targets: wasm32-unknown-unknown

      - run: cargo test
