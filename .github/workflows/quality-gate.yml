name: Quality Gate

env:
  NODE_VERSION: '26.12.0'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run_hardhat_tests:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.89.0
          targets: wasm32-unknown-unknown

      - run: cargo test
